<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Australia Song Contest Junior 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1a0b2e 0%, #2e083b 50%, #12031a 100%);
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .eurovision-card {
            background: rgba(30, 10, 45, 0.95);
            border: 1px solid rgba(217, 70, 239, 0.4);
            backdrop-filter: blur(16px);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
        }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-between">

    <div class="max-w-md mx-auto w-full eurovision-card rounded-3xl p-6 shadow-2xl my-auto">
        <!-- NAGŁÓWEK -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold tracking-wider bg-gradient-to-r from-pink-500 via-purple-300 to-cyan-300 bg-clip-text text-transparent">
                🇦🇺 ASC JUNIOR 2026
            </h1>
            <p class="text-xs text-purple-300 mt-1 uppercase tracking-widest font-semibold">Oficjalne Głosowanie Międzynarodowe</p>
        </div>

        <!-- ================= PANEL WIDZA / JURY ================= -->
        <div id="voter-panel">
            <!-- KROK 1: WYBÓR PAŃSTWA -->
            <div id="login-section">
                <label class="block text-sm font-medium text-pink-200 mb-2">Wybierz swoje państwo (Jury):</label>
                <select id="voter-country" class="w-full bg-purple-950 border border-purple-500/60 rounded-xl p-3.5 text-white mb-4 focus:outline-none focus:border-pink-500 font-semibold text-base">
                    <option value="">-- Wybierz kraj --</option>
                    <option value="Papua-Nowa Gwinea">Papua-Nowa Gwinea</option>
                    <option value="Nowa Kaledonia">Nowa Kaledonia</option>
                    <option value="Fidżi">Fidżi</option>
                    <option value="Nowa Zelandia">Nowa Zelandia</option>
                    <option value="USA">USA</option>
                    <option value="Kanada">Kanada</option>
                    <option value="Australia">Australia</option>
                    <option value="Tonga">Tonga</option>
                    <option value="Kiribati">Kiribati</option>
                    <option value="Western Australia">Western Australia</option>
                </select>
                <button type="button" onclick="startVoting()" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 font-bold py-3.5 rounded-xl shadow-lg shadow-purple-900/50 text-base active:scale-95 transition cursor-pointer">
                    Przejdź do Głosowania ➔
                </button>
            </div>

            <!-- KROK 2: FORMULARZ PUNKTACJI JUNIOR -->
            <div id="voting-section" class="hidden">
                <div class="bg-purple-900/60 p-3 rounded-xl mb-4 flex justify-between items-center text-sm border border-purple-500/40">
                    <span>Głosujesz jako: <strong id="current-voter-label" class="text-pink-400 font-bold"></strong></span>
                    <button type="button" onclick="logout()" class="text-xs text-purple-300 underline cursor-pointer">Zmień</button>
                </div>

                <p class="text-xs text-purple-200 mb-3 font-medium">Przydziel unikalne punkty (1, 2, 3, 4, 6 oraz 8 pkt):</p>
                
                <div class="space-y-2.5 mb-6">
                    <div class="flex items-center justify-between bg-purple-950/80 p-2.5 rounded-xl border border-purple-500/30">
                        <span class="font-extrabold text-pink-400 w-12 text-center">1p</span>
                        <select class="point-select bg-purple-900 border border-purple-500/50 rounded-lg p-2 text-white flex-1 ml-2 text-sm" data-points="1"></select>
                    </div>
                    <div class="flex items-center justify-between bg-purple-950/80 p-2.5 rounded-xl border border-purple-500/30">
                        <span class="font-extrabold text-pink-400 w-12 text-center">2p</span>
                        <select class="point-select bg-purple-900 border border-purple-500/50 rounded-lg p-2 text-white flex-1 ml-2 text-sm" data-points="2"></select>
                    </div>
                    <div class="flex items-center justify-between bg-purple-950/80 p-2.5 rounded-xl border border-purple-500/30">
                        <span class="font-extrabold text-pink-400 w-12 text-center">3p</span>
                        <select class="point-select bg-purple-900 border border-purple-500/50 rounded-lg p-2 text-white flex-1 ml-2 text-sm" data-points="3"></select>
                    </div>
                    <div class="flex items-center justify-between bg-purple-950/80 p-2.5 rounded-xl border border-purple-500/30">
                        <span class="font-extrabold text-pink-400 w-12 text-center">4p</span>
                        <select class="point-select bg-purple-900 border border-purple-500/50 rounded-lg p-2 text-white flex-1 ml-2 text-sm" data-points="4"></select>
                    </div>
                    <div class="flex items-center justify-between bg-purple-950/80 p-2.5 rounded-xl border border-purple-500/30">
                        <span class="font-extrabold text-pink-400 w-12 text-center">6p</span>
                        <select class="point-select bg-purple-900 border border-purple-500/50 rounded-lg p-2 text-white flex-1 ml-2 text-sm" data-points="6"></select>
                    </div>
                    <div class="flex items-center justify-between bg-purple-950/80 p-2.5 rounded-xl border border-purple-500/30">
                        <span class="font-extrabold text-pink-400 w-12 text-center">8p</span>
                        <select class="point-select bg-purple-900 border border-purple-500/50 rounded-lg p-2 text-white flex-1 ml-2 text-sm" data-points="8"></select>
                    </div>
                </div>

                <button type="button" id="submit-btn" onclick="submitVote()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-900/50 text-base active:scale-95 transition cursor-pointer">
                    Zatwierdź i Wyślij Głosy ✓
                </button>
            </div>
        </div>

        <!-- ================= PANEL ORGANIZATORA (PIN: 2026) ================= -->
        <div id="admin-panel" class="hidden">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-purple-500/30">
                <h2 class="text-base font-bold text-pink-400">🏆 Tabela Wyników na Żywo</h2>
                <div class="flex gap-2">
                    <button type="button" onclick="resetData()" class="text-xs bg-rose-950 text-rose-300 px-2.5 py-1.5 rounded-lg border border-rose-700/50 font-semibold cursor-pointer">Reset</button>
                    <button type="button" onclick="lockAdmin()" class="text-xs bg-purple-950 text-purple-300 px-2.5 py-1.5 rounded-lg border border-purple-700/50 font-semibold cursor-pointer">Zamknij</button>
                </div>
            </div>

            <div id="scoreboard" class="space-y-2 mb-6 max-h-64 overflow-y-auto pr-1"></div>

            <div class="bg-purple-950/80 p-3 rounded-xl border border-purple-500/30 text-xs">
                <p class="font-semibold text-purple-300 mb-2">Status państw:</p>
                <div id="voting-status" class="flex flex-wrap gap-1.5"></div>
            </div>
        </div>

        <!-- PRZYCISK PIN -->
        <div class="mt-8 text-center pt-4 border-t border-purple-900/50">
            <button type="button" onclick="openAdmin()" class="text-[11px] text-purple-400/60 hover:text-purple-300 tracking-wider cursor-pointer">
                🔒 Panel Organizatora
            </button>
        </div>
    </div>

    <script>
        const allCountries = [
            "Papua-Nowa Gwinea", "Nowa Kaledonia", "Fidżi", 
            "Nowa Zelandia", "USA", "Kanada", 
            "Australia", "Tonga", "Kiribati", "Western Australia"
        ];
        const ADMIN_PIN = "2026";

        const BIN_ID = "66f42a0fe41b4d34e437c1a2";
        const API_KEY = "$2a$10$7R93kK2V7dG15W.xW8UuNe0s85Z2XbA/dI64nZ.pC9V3cM.7qG/lG";
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        let globalState = { votes: {}, votedCountries: [] };
        let activeVoter = "";

        async function fetchState() {
            try {
                let res = await fetch(`${API_URL}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                let data = await res.json();
                if (data.record && Array.isArray(data.record.votedCountries)) {
                    globalState = data.record;
                    updateMainDropdown();
                }
            } catch (e) {
                console.log("Synchronizacja w tle...", e);
            }
        }

        async function saveState() {
            try {
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(globalState)
                });
            } catch (e) {
                alert("Błąd zapisu w chmurze!");
            }
        }

        function updateMainDropdown() {
            const select = document.getElementById('voter-country');
            const currentVal = select.value;
            select.innerHTML = '<option value="">-- Wybierz kraj --</option>';
            
            allCountries.forEach(c => {
                if (!globalState.votedCountries.includes(c)) {
                    let opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = c;
                    select.appendChild(opt);
                }
            });
            if (currentVal && !globalState.votedCountries.includes(currentVal)) {
                select.value = currentVal;
            }
        }

        function startVoting() {
            const select = document.getElementById('voter-country');
            const val = select.value;
            
            if (!val) {
                alert("Najpierw wybierz swoje państwo z listy!");
                return;
            }
            
            activeVoter = val;
            
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('voting-section').classList.remove('hidden');
            document.getElementById('current-voter-label').textContent = activeVoter;
            
            const selects = document.querySelectorAll('.point-select');
            selects.forEach(sel => {
                sel.innerHTML = '<option value="">-- Wybierz kraj --</option>';
                allCountries.forEach(c => {
                    if (c !== activeVoter) {
                        let opt = document.createElement('option');
                        opt.value = c;
                        opt.textContent = c;
                        sel.appendChild(opt);
                    }
                });
            });
        }

        function logout() {
            activeVoter = "";
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('voting-section').classList.add('hidden');
            updateMainDropdown();
        }

        async function submitVote() {
            const btn = document.getElementById('submit-btn');
            const selects = document.querySelectorAll('.point-select');
            let selections = {};
            let chosen = new Set();

            for (let s of selects) {
                let pts = s.dataset.points;
                let c = s.value;
                if (!c) {
                    alert("Musisz rozdzielić wszystkie punkty!");
                    return;
                }
                if (chosen.has(c)) {
                    alert("Nie możesz wybrać tego samego kraju dla różnych punktów!");
                    return;
                }
                chosen.add(c);
                selections[pts] = c;
            }

            btn.disabled = true;
            btn.textContent = "Wysyłanie...";

            globalState.votes[activeVoter] = selections;
            if (!globalState.votedCountries.includes(activeVoter)) {
                globalState.votedCountries.push(activeVoter);
            }
            
            await saveState();
            
            alert("Głosy zostały zapisane pomyślnie w chmurze!");
            btn.disabled = false;
            btn.textContent = "Zatwierdź i Wyślij Głosy ✓";
            logout();
        }

        function openAdmin() {
            let pin = prompt("Podaj PIN organizatora:");
            if (pin === ADMIN_PIN) {
                document.getElementById('voter-panel').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                fetchState().then(() => {
                    renderScoreboard();
                    renderStatus();
                });
            } else if (pin !== null) {
                alert("Błędny PIN!");
            }
        }

        function lockAdmin() {
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('voter-panel').classList.remove('hidden');
            updateMainDropdown();
        }

        function renderScoreboard() {
            let scores = {};
            allCountries.forEach(c => scores[c] = 0);
            
            for (let v in globalState.votes) {
                let map = globalState.votes[v];
                for (let p in map) {
                    let target = map[p];
                    if (scores[target] !== undefined) scores[target] += parseInt(p);
                }
            }

            const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
            const board = document.getElementById('scoreboard');
            board.innerHTML = "";

            sorted.forEach(([country, pts], index) => {
                let row = document.createElement('div');
                row.className = "flex justify-between items-center bg-purple-950/80 p-2.5 rounded-xl border border-purple-500/30 text-sm";
                row.innerHTML = `<span class="font-semibold text-purple-100">${index + 1}. ${country}</span><span class="font-bold text-pink-400 text-base">${pts} pkt</span>`;
                board.appendChild(row);
            });
        }

        function renderStatus() {
            const container = document.getElementById('voting-status');
            container.innerHTML = "";
            allCountries.forEach(c => {
                let badge = document.createElement('span');
                let hasVoted = globalState.votedCountries.includes(c);
                badge.className = `text-[10px] px-2 py-1 rounded-md font-medium ${hasVoted ? 'bg-pink-950/80 text-pink-300 border border-pink-700/50' : 'bg-purple-900/40 text-purple-300 border border-purple-700/30'}`;
                badge.textContent = `${c} ${hasVoted ? '✓' : '...'}`;
                container.appendChild(badge);
            });
        }

        async function resetData() {
            if (confirm("Zresetować wszystkie głosy z bazy internetowej?")) {
                globalState = { votes: {}, votedCountries: [] };
                await saveState();
                lockAdmin();
                fetchState();
                alert("Zresetowano konkurs!");
            }
        }

        window.onload = () => {
            fetchState();
            setInterval(fetchState, 5000);
        };
    </script>
</body>
</html>
